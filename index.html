<body>
<div class="app">
  <header class="top"><div class="top-inner"><div class="brand"><div class="logo">◖))</div><div><h1>Phonics 声音实验室</h1><small>听 · 看 · 说</small></div></div><label class="search"><span>⌕</span><input id="search" type="search" aria-label="搜索发音或例词" placeholder="搜索字母、组合或例词…"></label><button class="round" id="randomBtn">随机练习</button></div></header>
  <main class="layout"><aside class="side"><h2>声音分类</h2><nav class="filters" id="filters"></nav><section class="practice"><h3>每日跟读</h3><p>听一遍，自己说一遍，再回放比较。</p><button id="sideRandom">开始随机练习</button></section></aside>
  <section class="content"><div class="hero"><div><div class="eyebrow">English sound map</div><h2>把英语的声音<br>装进口袋里</h2><p>从 26 个字母到常见字母组合。点击卡片上的喇叭听读音，打开跟读模式录下自己的声音。</p></div><div class="stats"><strong id="total">0</strong><span>个核心发音与组合</span></div></div>
  <div class="toolbar"><button class="primary" id="playAll">▶ 播放当前分类</button><button id="stopAll">■ 停止</button><span class="spacer"></span><label class="speed">语速 <select id="rate"><option value="0.65">慢速</option><option value="0.82" selected>标准</option><option value="1">自然</option></select></label></div><div id="results"></div></section></main>
</div>
<div class="drawer" id="drawer" aria-hidden="true"><div class="backdrop" data-close></div><section class="panel" role="dialog" aria-modal="true" aria-labelledby="practiceTitle"><button class="close" data-close aria-label="关闭">×</button><div class="big" id="practiceSymbol"></div><h2 id="practiceTitle"></h2><div class="desc" id="practiceDesc"></div><div class="example" id="practiceExample"></div><div class="listen"><button id="listenSound">听发音</button><button id="listenWord">听例词</button></div><div class="recorder"><strong>轮到你了</strong><p class="record-status" id="recordStatus">点击按钮，清楚地读出这个发音和例词。</p><button class="record-btn" id="recordBtn">● 开始录音</button><audio class="playback" id="playback" controls hidden></audio></div><div class="tip">小提示：先观察例词中高亮的字母，再听声音；录音后不要急着判断对错，重点比较嘴型、长短和清浊。</div></section></div>
<div class="notice" id="notice"></div>
<script>
const groups={letters:'单字母音',digraphs:'辅音组合',vowels:'元音组合',rcontrolled:'R 控制元音',diphthongs:'双元音与滑音',endings:'词尾与特殊组合'};
const sounds=[
['a','/æ/','短元音','apple','letters'],['b','/b/','浊辅音','ball','letters'],['c','/k/','常见硬音','cat','letters'],['d','/d/','浊辅音','dog','letters'],['e','/e/','短元音','egg','letters'],['f','/f/','清辅音','fish','letters'],['g','/g/','常见硬音','goat','letters'],['h','/h/','呼气音','hat','letters'],['i','/ɪ/','短元音','ink','letters'],['j','/dʒ/','浊辅音','jam','letters'],['k','/k/','清辅音','kite','letters'],['l','/l/','舌边音','leg','letters'],['m','/m/','鼻音','moon','letters'],['n','/n/','鼻音','nest','letters'],['o','/ɒ/','短元音','octopus','letters'],['p','/p/','清辅音','pig','letters'],['q','/kw/','常与 u 搭配','queen','letters'],['r','/r/','卷舌近音','red','letters'],['s','/s/','清辅音','sun','letters'],['t','/t/','清辅音','top','letters'],['u','/ʌ/','短元音','umbrella','letters'],['v','/v/','浊辅音','van','letters'],['w','/w/','滑音','web','letters'],['x','/ks/','组合辅音','box','letters'],['y','/j/','词首常见音','yes','letters'],['z','/z/','浊辅音','zebra','letters'],
['sh','/ʃ/','嘘声','ship','digraphs'],['ch','/tʃ/','塞擦音','chair','digraphs'],['th','/θ/','清音','think','digraphs'],['th','/ð/','浊音','this','digraphs'],['ph','/f/','与 f 同音','phone','digraphs'],['wh','/w/','疑问词常见','whale','digraphs'],['ck','/k/','短元音后常见','duck','digraphs'],['ng','/ŋ/','后鼻音','ring','digraphs'],['nk','/ŋk/','鼻音加 k','pink','digraphs'],['qu','/kw/','固定搭配','queen','digraphs'],['wr','/r/','w 不发音','write','digraphs'],['kn','/n/','k 不发音','knee','digraphs'],['gn','/n/','g 不发音','gnome','digraphs'],['mb','/m/','词尾 b 不发音','lamb','digraphs'],
['ai','/eɪ/','长 a','rain','vowels'],['ay','/eɪ/','常在词尾','play','vowels'],['a_e','/eɪ/','魔法 e','cake','vowels'],['ee','/iː/','长 e','tree','vowels'],['ea','/iː/','长 e','beach','vowels'],['e_e','/iː/','魔法 e','these','vowels'],['igh','/aɪ/','长 i','night','vowels'],['ie','/aɪ/','长 i','pie','vowels'],['i_e','/aɪ/','魔法 e','bike','vowels'],['oa','/oʊ/','长 o','boat','vowels'],['ow','/oʊ/','长 o','snow','vowels'],['o_e','/oʊ/','魔法 e','home','vowels'],['oo','/uː/','长音','moon','vowels'],['oo','/ʊ/','短音','book','vowels'],['ue','/uː/','长 u','blue','vowels'],['ew','/uː/','长 u','chew','vowels'],['u_e','/juː/','魔法 e','cube','vowels'],
['ar','/ɑːr/','R 控制 a','star','rcontrolled'],['or','/ɔːr/','R 控制 o','fork','rcontrolled'],['er','/ɜːr/','常见弱读','her','rcontrolled'],['ir','/ɜːr/','与 er 同类','bird','rcontrolled'],['ur','/ɜːr/','与 er 同类','turn','rcontrolled'],['air','/eər/','三字母组合','chair','rcontrolled'],['ear','/ɪər/','三字母组合','ear','rcontrolled'],
['oi','/ɔɪ/','双元音','coin','diphthongs'],['oy','/ɔɪ/','常在词尾','boy','diphthongs'],['ou','/aʊ/','双元音','cloud','diphthongs'],['ow','/aʊ/','双元音','cow','diphthongs'],['au','/ɔː/','常见组合','August','diphthongs'],['aw','/ɔː/','常在词尾','saw','diphthongs'],['ear','/eər/','另一种读音','bear','diphthongs'],['eer','/ɪər/','卷舌尾音','deer','diphthongs'],
['tion','/ʃən/','常见名词词尾','station','endings'],['sion','/ʒən/','常见词尾','vision','endings'],['ture','/tʃər/','常见词尾','picture','endings'],['dge','/dʒ/','短元音后常见','bridge','endings'],['ge','/dʒ/','词尾软 g','cage','endings'],['ce','/s/','词尾软 c','face','endings'],['le','/əl/','辅音 + le','table','endings'],['ed','/t/','清辅音后','jumped','endings'],['ed','/d/','浊音后','played','endings'],['ed','/ɪd/','t/d 后','wanted','endings'],['s','/s/','清辅音后','cats','endings'],['s','/z/','浊音后','dogs','endings'],['es','/ɪz/','嘶擦音后','buses','endings']
].map((x,i)=>({id:i,symbol:x[0],ipa:x[1],desc:x[2],word:x[3],group:x[4]}));
let active='all',query='',current=null,queueStop=false,recorder=null,chunks=[];
const $=s=>document.querySelector(s);const results=$('#results');
const soundCues={'/æ/':'ah','/b/':'buh','/k/':'kuh','/d/':'duh','/e/':'eh','/f/':'fff','/g/':'guh','/h/':'huh','/ɪ/':'ih','/dʒ/':'juh','/l/':'lll','/m/':'mmm','/n/':'nnn','/ɒ/':'aw','/p/':'puh','/kw/':'kwuh','/r/':'rrr','/s/':'sss','/t/':'tuh','/ʌ/':'uh','/v/':'vvv','/w/':'wuh','/ks/':'ks','/j/':'yuh','/z/':'zzz','/ʃ/':'shh','/tʃ/':'ch','/θ/':'th','/ð/':'the','/ŋ/':'ng','/ŋk/':'nk','/iː/':'ee','/eɪ/':'ay','/aɪ/':'eye','/oʊ/':'oh','/uː/':'oo','/ʊ/':'uuh','/juː/':'you','/ɑːr/':'ar','/ɔːr/':'or','/ɜːr/':'er','/eər/':'air','/ɪər/':'ear','/ɔɪ/':'oy','/aʊ/':'ow','/ɔː/':'aw','/ʃən/':'shun','/ʒən/':'zhun','/tʃər/':'chur','/əl/':'uhl','/t/':'t','/ɪd/':'id'};
function say(text,word=false,cancel=true){if(cancel)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=Number($('#rate').value)*(word?0.82:0.64);const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'))||null;speechSynthesis.speak(u);return u}
function repeat3(text){return `${text}. ${text}. ${text}.`}
function letterName(s){return s.symbol.replace('_',' ').split('').join(' ')}
function soundCue(s){return soundCues[s.ipa]||s.word}
function teachText(s){return `${repeat3(letterName(s))} ${repeat3(soundCue(s))} ${repeat3(s.word)}`}
function teach(s,cancel=true){return say(teachText(s),false,cancel)}
function highlight(s){let w=s.word;const plain=s.symbol.replace('_','');let idx=w.toLowerCase().indexOf(plain.toLowerCase());if(idx<0&&s.symbol.includes('_')){const [a,b]=s.symbol.split('_');idx=w.toLowerCase().indexOf(a);if(idx>=0)return w.slice(0,idx)+'<b>'+w.slice(idx,idx+a.length)+'</b>'+w.slice(idx+a.length,w.length-1)+'<b>'+w.slice(-1)+'</b>'}if(idx<0)return w;return w.slice(0,idx)+'<b>'+w.slice(idx,idx+plain.length)+'</b>'+w.slice(idx+plain.length)}
function buildFilters(){const items=[['all','全部发音'],...Object.entries(groups)];$('#filters').innerHTML=items.map(([k,v])=>`<button class="filter ${k===active?'active':''}" data-filter="${k}"><span>${v}</span><span class="count">${k==='all'?sounds.length:sounds.filter(s=>s.group===k).length}</span></button>`).join('')}
function filtered(){return sounds.filter(s=>(active==='all'||s.group===active)&&(!query||[s.symbol,s.ipa,s.word,s.desc].join(' ').toLowerCase().includes(query)))}
function render(){buildFilters();const list=filtered();$('#total').textContent=sounds.length;if(!list.length){results.innerHTML='<div class="empty">没有找到匹配的声音，换个关键词试试。</div>';return}const by={};list.forEach(s=>(by[s.group]??=[]).push(s));results.innerHTML=Object.entries(by).map(([g,arr])=>`<section><div class="section-title"><h3>${groups[g]}</h3><span>${arr.length} 个</span></div><div class="grid">${arr.map(s=>`<article class="card" data-id="${s.id}"><div class="actions"><button class="icon-btn speak" aria-label="朗读 ${s.symbol}">🔊</button><button class="icon-btn practice-open" aria-label="跟读 ${s.symbol}">●</button></div><div><span class="symbol">${s.symbol}</span><span class="ipa">${s.ipa}</span></div><div class="desc">${s.desc}</div><div class="example">${highlight(s)}</div></article>`).join('')}</div></section>`).join('')}
function openPractice(s){current=s;$('#practiceSymbol').textContent=s.symbol;$('#practiceTitle').textContent=s.ipa+' · '+s.desc;$('#practiceDesc').textContent='字母或组合 × 3 · 发音 × 3 · 例词 × 3';$('#practiceExample').innerHTML='例词：'+highlight(s);$('#playback').hidden=true;$('#recordStatus').textContent='点击按钮，按三遍的节奏跟读。';$('#drawer').classList.add('open');$('#drawer').setAttribute('aria-hidden','false')}
function closePractice(){if(recorder?.state==='recording')recorder.stop();$('#drawer').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');speechSynthesis.cancel()}
function toast(t){$('#notice').textContent=t;$('#notice').classList.add('show');setTimeout(()=>$('#notice').classList.remove('show'),2200)}
async function toggleRecord(){if(recorder?.state==='recording'){recorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{const url=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));$('#playback').src=url;$('#playback').hidden=false;$('#recordBtn').textContent='● 重新录音';$('#recordBtn').classList.remove('recording');$('#recordStatus').textContent='录好了！点击播放，和标准发音比较。';stream.getTracks().forEach(t=>t.stop())};recorder.start();$('#recordBtn').textContent='■ 停止录音';$('#recordBtn').classList.add('recording');$('#recordStatus').textContent='正在录音… 读出 “'+current.symbol+'，'+current.word+'”'}catch(e){toast('需要允许麦克风权限才能录音')}}
document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){active=f.dataset.filter;render()}const card=e.target.closest('.card');if(card){const s=sounds[+card.dataset.id];if(e.target.closest('.speak')){card.classList.add('playing');const u=teach(s);u.onend=()=>card.classList.remove('playing')}else if(e.target.closest('.practice-open'))openPractice(s)}if(e.target.closest('[data-close]'))closePractice()});
$('#search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});$('#listenSound').onclick=()=>say(repeat3(soundCue(current)));$('#listenWord').onclick=()=>say(repeat3(current.word),true);$('#recordBtn').onclick=toggleRecord;$('#randomBtn').onclick=$('#sideRandom').onclick=()=>openPractice(sounds[Math.floor(Math.random()*sounds.length)]);
$('#playAll').onclick=()=>{queueStop=false;const list=filtered();let i=0;speechSynthesis.cancel();function next(){if(queueStop||i>=list.length)return;const u=teach(list[i++],false);u.onend=()=>setTimeout(next,500)}next()};$('#stopAll').onclick=()=>{queueStop=true;speechSynthesis.cancel()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closePractice()});render();
</script>
</body></html>
